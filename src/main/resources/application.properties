# Nome da aplicação
spring.application.name=cs-hub

# Lê variáveis de um arquivo .env na raiz do projeto (opcional).
# Assim nenhuma senha fica escrita no código.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Conexão com o MySQL - os valores vêm de variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cs_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate - cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dados iniciais (times, jogadores, mapas...) inseridos se o banco estiver vazio
app.seed.enabled=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
